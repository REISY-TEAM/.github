name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.12'
    secrets:
      KIT_DEPLOY_KEY:
        description: 'Read-only deploy key for the private REISY-TEAM/reisy-service-kit. Repos without it skip the step.'
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-python:
    name: Python Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_KIT_DEPLOY_KEY: ${{ secrets.KIT_DEPLOY_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Load the kit deploy key
        if: env.HAS_KIT_DEPLOY_KEY == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.KIT_DEPLOY_KEY }}

      - name: Fetch the kit over SSH
        if: env.HAS_KIT_DEPLOY_KEY == 'true'
        run: git config --global url."ssh://git@github.com/REISY-TEAM/reisy-service-kit".insteadOf https://github.com/REISY-TEAM/reisy-service-kit

      - name: Ruff Check
        run: |
          set -euo pipefail
          uv run --only-dev ruff check --output-format=full . || ruff check .

      - name: Ruff Format Check
        run: |
          set -euo pipefail
          uv run --only-dev ruff format --check . || ruff format --check .

      - name: Run Mypy Typecheck
        run: |
          set -euo pipefail
          mapfile -t py_files < <(git ls-files '*.py' | grep -Ev '(^|/)(\.agents|\.github|features|tests)/|(^|/)test_[^/]*\.py$' || true)
          if [ "${#py_files[@]}" -gt 0 ]; then
            uv run mypy "${py_files[@]}" || true
          fi

      - name: Run Unit Tests
        run: |
          set -euo pipefail
          uv run pytest -m "not slow" || pytest
